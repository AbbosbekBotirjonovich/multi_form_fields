name: multi_form_fields
description: A powerful Flutter package for managing multiple form fields with built-in debouncing, automatic focus control, and TextEditingController management.
version: 1.0.2
homepage: https://github.com/AbbosbekBotirjonovich/multi_form_fields
repository: https://github.com/AbbosbekBotirjonovich/multi_form_fields
issue_tracker: https://github.com/AbbosbekBotirjonovich/multi_form_fields/issues
documentation: https://github.com/AbbosbekBotirjonovich/multi_form_fields#readme

topics:
  - forms
  - text-field
  - debounce
  - form-validation
  - form-management

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
